name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout move_by_move
        uses: actions/checkout@v6
        with:
          path: move_by_move

      - name: Checkout eboard-connect-js
        uses: actions/checkout@v6
        with:
          repository: nmarchand73/eboard-connect-js
          path: eboard-connect-js

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            move_by_move/web/package-lock.json
            eboard-connect-js/package-lock.json

      - name: Resolve semantic version
        id: version
        working-directory: move_by_move/web
        run: |
          # major.minor from package.json; patch = Actions run number (increments each Pages deploy)
          BASE=$(node -p "const [maj,min]=require('./package.json').version.split('.'); maj + '.' + min")
          echo "app_version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${BASE}.${{ github.run_number }}"

      - name: Install and build
        working-directory: move_by_move/web
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          npm --prefix ../../eboard-connect-js ci
          npm --prefix ../../eboard-connect-js run build
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: move_by_move/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
